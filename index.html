<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>3号巴士 点名表</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:#eef1f6;color:#1f2937;-webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:760px;margin:0 auto;padding:14px 12px 104px;}

  /* ---------- 头部 ---------- */
  .hero{
    display:flex;align-items:center;gap:13px;
    background:linear-gradient(135deg,#2f6bff,#1d4ed8);
    color:#fff;border-radius:16px;padding:16px 18px;
    box-shadow:0 8px 20px rgba(37,99,235,.28);margin-bottom:12px;
  }
  .bus-badge{
    width:50px;height:50px;flex:none;border-radius:14px;
    background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.65);
    display:flex;align-items:center;justify-content:center;
    font-size:27px;font-weight:800;letter-spacing:0;
  }
  .hero h1{margin:0;font-size:20px;letter-spacing:.5px;}
  .hero p{margin:4px 0 0;font-size:12.5px;opacity:.88;}

  /* ---------- 提醒条 ---------- */
  .notice{
    display:flex;gap:10px;align-items:flex-start;
    background:#fff8e1;border:1px solid #ffe08a;border-left:5px solid #f5a623;
    color:#7a4d00;border-radius:12px;padding:11px 14px;
    font-size:13.5px;line-height:1.6;margin-bottom:12px;
  }
  .notice-icon{font-size:16px;line-height:1.5;flex:none;}
  .notice b{color:#c2410c;}

  /* ---------- 搜索栏 ---------- */
  .search-bar{
    display:flex;align-items:center;gap:8px;
    background:#fff;border-radius:12px;padding:8px 12px;
    margin-bottom:14px;box-shadow:0 2px 8px rgba(15,23,42,.05);
    flex-wrap:wrap;
  }
  .search-bar input{
    flex:1;min-width:120px;border:none;outline:none;
    font-size:14px;padding:8px 4px;font-family:inherit;
    background:transparent;color:#1e293b;
  }
  .search-bar input::placeholder{color:#94a3b8;}
  .search-bar button{
    border:none;border-radius:8px;padding:8px 14px;
    font-size:13.5px;font-weight:600;cursor:pointer;
    font-family:inherit;transition:transform .12s,background .15s;
    white-space:nowrap;
  }
  .search-bar button:active{transform:scale(.95);}
  #searchBtn{background:#2563eb;color:#fff;}
  #searchBtn:active{background:#1d4ed8;}
  #clearSearchBtn{background:#eef2f7;color:#475569;}
  #clearSearchBtn:active{background:#e2e8f0;}
  .search-result{
    font-size:12.5px;color:#64748b;margin-left:4px;
    white-space:nowrap;min-width:48px;
  }

  /* ---------- 分组卡片 ---------- */
  .group{
    background:#fff;border-radius:14px;overflow:hidden;
    margin-bottom:14px;box-shadow:0 2px 10px rgba(15,23,42,.06);
  }
  .group-head{
    display:flex;align-items:center;gap:10px;
    padding:11px 14px;background:#f8fafc;border-bottom:1px solid #e6eaf0;
  }
  .group-name{font-weight:700;font-size:16px;color:#1e3a8a;}
  .group-count{font-size:13px;color:#64748b;margin-right:auto;}
  .all-btn{
    border:1px solid #cbd5e1;background:#fff;color:#334155;
    border-radius:8px;padding:5px 11px;font-size:12.5px;cursor:pointer;
    font-family:inherit;transition:transform .12s,background .15s;
  }
  .all-btn:active{transform:scale(.95);background:#f1f5f9;}

  /* ---------- 表格 ---------- */
  .tbl{width:100%;border-collapse:collapse;}
  .tbl th{
    font-size:11.5px;font-weight:600;color:#94a3b8;text-align:left;
    padding:8px 8px;border-bottom:1px solid #eef2f7;background:#fff;
  }
  .tbl td{
    padding:10px 8px;border-bottom:1px solid #f1f5f9;
    font-size:13.5px;vertical-align:middle;line-height:1.35;
  }
  .tbl tr:last-child td{border-bottom:none;}
  .tbl th:nth-child(1){width:26%;}
  .tbl th:nth-child(2){width:11%;}
  .tbl th:nth-child(3){width:21%;}
  .tbl th:nth-child(4){width:19%;}
  .tbl th:nth-child(5){width:9%;}
  .tbl th:nth-child(6){width:14%;text-align:center;}
  .tbl td:nth-child(5){text-align:center;color:#64748b;}
  .tbl td:nth-child(6){text-align:center;}
  .tbl td:nth-child(3),
  .tbl td:nth-child(4){color:#475569;font-size:13px;}

  .name{font-weight:600;color:#1e293b;}

  /* ---------- 行状态 ---------- */
  .row{cursor:pointer;transition:background .15s;}
  .row:active{background:#f8fafc;}
  .row.done{background:#f0fdf4;}
  .row.done .name{color:#15803d;}
  .row.divert{background:#fffdf5;}
  .row.divert.done{background:#f0fdf4;}

  /* 搜索高亮 */
  .row.highlight{
    background:#fef3c7 !important;
    box-shadow:inset 0 0 0 2px #f59e0b;
  }
  .row.highlight.done{
    background:#fef3c7 !important;
  }
  @keyframes flash{
    0%{box-shadow:inset 0 0 0 2px #f59e0b;}
    50%{box-shadow:inset 0 0 0 4px #fbbf24;}
    100%{box-shadow:inset 0 0 0 2px #f59e0b;}
  }
  .row.highlight{animation:flash .9s ease 1;}

  .box{
    display:inline-block;width:22px;height:22px;border-radius:7px;
    border:2px solid #cbd5e1;background:#fff;position:relative;
    transition:background .15s,border-color .15s;
  }
  .row.done .box{background:#16a34a;border-color:#16a34a;}
  .row.done .box::after{
    content:"";position:absolute;left:6px;top:2px;width:6px;height:11px;
    border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg);
  }

  .gender{
    display:inline-block;min-width:24px;text-align:center;
    padding:2px 6px;border-radius:6px;font-size:11.5px;font-weight:600;
  }
  .g-f{background:#fce7f3;color:#be185d;}
  .g-m{background:#dbeafe;color:#1d4ed8;}

  .tag{
    display:inline-block;margin-left:5px;font-size:10.5px;font-weight:600;
    background:#fff1f2;color:#e11d48;border:1px solid #fecdd3;
    border-radius:6px;padding:1px 5px;vertical-align:middle;white-space:nowrap;
  }

  /* ---------- 底部统计栏 ---------- */
  .footer-bar{
    position:fixed;left:0;right:0;bottom:0;z-index:9;
    max-width:760px;margin:0 auto;
    display:flex;align-items:center;gap:12px;
    padding:12px 16px calc(12px + env(safe-area-inset-bottom));
    background:rgba(255,255,255,.94);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    border-top:1px solid #e2e8f0;border-radius:16px 16px 0 0;
    box-shadow:0 -4px 16px rgba(15,23,42,.06);
  }
  .stat{font-size:13.5px;color:#475569;}
  .stat b{color:#2563eb;font-size:19px;font-weight:800;margin:0 1px;}
  #resetBtn{
    margin-left:auto;border:none;border-radius:10px;
    padding:9px 20px;background:#eef2f7;color:#475569;
    font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;
    transition:transform .12s,background .15s;
  }
  #resetBtn:active{transform:scale(.96);background:#e2e8f0;}

  @media print{
    body{background:#fff;}
    .wrap{padding-bottom:0;max-width:none;}
    .footer-bar,.all-btn,.search-bar{display:none;}
    .group{box-shadow:none;border:1px solid #ddd;}
    .hero{box-shadow:none;}
    .row.highlight{background:transparent !important;box-shadow:none !important;animation:none !important;}
  }
</style>
</head>
<body>

<div class="wrap">
  <header class="hero">
    <div class="bus-badge">3</div>
    <div>
      <h1>3号巴士 点名表</h1>
      <p>5班 · 6班 · 9班 住宿生 ｜ 共 15 人</p>
    </div>
  </header>

  <div class="notice">
    <span class="notice-icon">🔔</span>
    <div>
      <strong>特别提醒：</strong>6班女生 —— <b>孙奕帆、周茜琦、陈予洵</b>，
      请前往 <b>4号巴士</b> 乘坐，3号车不再等候。
    </div>
  </div>

  <!-- 宿舍号查找定位 -->
  <div class="search-bar">
    <input type="search" id="dormSearch" placeholder="输入宿舍号，如 213 或 女生213" autocomplete="off">
    <button id="searchBtn">查找</button>
    <button id="clearSearchBtn">清除</button>
    <span class="search-result" id="searchResult"></span>
  </div>

  <div id="list"></div>
</div>

<div class="footer-bar">
  <div class="stat">已到 <b id="doneCount">0</b> / <span id="totalCount">15</span> 人</div>
  <button id="resetBtn">重 置</button>
</div>

<script>
const DATA = [
  {
    cls: '5班',
    students: [
      { name:'危笑',   gender:'女', dorm:'女生213', duty:'宿舍长',   num:'5' },
      { name:'宋怡霓', gender:'女', dorm:'女生214', duty:'宿舍长',   num:'6' },
      { name:'郭悦棶', gender:'男', dorm:'男生301', duty:'宿舍长',   num:'2' },
      { name:'方智杰', gender:'男', dorm:'男生302', duty:'宿舍长',   num:'6' }
    ]
  },
  {
    cls: '6班',
    students: [
      { name:'孙奕帆', gender:'女', dorm:'女生215', duty:'宿舍长', num:'5', note:'去4车' },
      { name:'周茜琦', gender:'女', dorm:'女生216', duty:'宿舍长', num:'5', note:'去4车' },
      { name:'陈予洵', gender:'女', dorm:'女生217', duty:'宿舍长', num:'5', note:'去4车' },
      { name:'张启正', gender:'男', dorm:'男生301', duty:'并入303', num:'7' },
      { name:'梁峻豪', gender:'男', dorm:'男生303', duty:'宿舍长',  num:'7' },
      { name:'张恒嘉', gender:'男', dorm:'男生304', duty:'宿舍长',  num:'7' },
      { name:'梁之晓', gender:'男', dorm:'男生312', duty:'并入304', num:'7' }
    ]
  },
  {
    cls: '9班',
    students: [
      { name:'贾涵淇', gender:'女', dorm:'女生221', duty:'宿舍长', num:'5' },
      { name:'黄艺淇', gender:'女', dorm:'女生223', duty:'宿舍长', num:'3' },
      { name:'廖泽熙', gender:'男', dorm:'男生309', duty:'宿舍长', num:'6' },
      { name:'张浩鹏', gender:'男', dorm:'男生310', duty:'宿舍长', num:'6' }
    ]
  }
];

const listEl = document.getElementById('list');

DATA.forEach((group, gi) => {
  const section = document.createElement('section');
  section.className = 'group';
  section.innerHTML = `
    <div class="group-head">
      <span class="group-name">${group.cls}</span>
      <span class="group-count"><b>0</b>/${group.students.length}</span>
      <button class="all-btn" data-group="${gi}">全部到齐</button>
    </div>
    <table class="tbl">
      <thead>
        <tr>
          <th>姓名</th><th>性别</th><th>宿舍</th><th>职务</th><th>人数</th><th>状态</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>`;

  const tbody = section.querySelector('tbody');

  group.students.forEach((s, si) => {
    const tr = document.createElement('tr');
    tr.className = 'row' + (s.note ? ' divert' : '');
    tr.dataset.group = gi;
    tr.dataset.key = gi + '-' + si;
    tr.innerHTML = `
      <td class="name">${s.name}${s.note ? `<span class="tag">${s.note}</span>` : ''}</td>
      <td><span class="gender ${s.gender === '女' ? 'g-f' : 'g-m'}">${s.gender}</span></td>
      <td>${s.dorm}</td>
      <td>${s.duty}</td>
      <td>${s.num}</td>
      <td><span class="box"></span></td>`;
    tr.addEventListener('click', () => {
      tr.classList.toggle('done');
      updateStats();
    });
    tbody.appendChild(tr);
  });

  listEl.appendChild(section);
});

/* 统计 */
function updateStats() {
  const rows = document.querySelectorAll('.row');
  const done = document.querySelectorAll('.row.done').length;
  document.getElementById('doneCount').textContent = done;
  document.getElementById('totalCount').textContent = rows.length;

  document.querySelectorAll('.group').forEach(g => {
    const all = g.querySelectorAll('.row').length;
    const d = g.querySelectorAll('.row.done').length;
    g.querySelector('.group-count b').textContent = d;
  });
}

/* 整班「全部到齐」 */
document.querySelectorAll('.all-btn').forEach(btn => {
  btn.addEventListener('click', e => {
    e.stopPropagation();
    const rows = document.querySelectorAll(`.row[data-group="${btn.dataset.group}"]`);
    const allDone = Array.from(rows).every(r => r.classList.contains('done'));
    rows.forEach(r => r.classList.toggle('done', !allDone));
    updateStats();
  });
});

/* 重置 */
document.getElementById('resetBtn').addEventListener('click', () => {
  document.querySelectorAll('.row.done').forEach(r => r.classList.remove('done'));
  updateStats();
});

/* ---------- 宿舍号查找定位 ---------- */
const dormInput = document.getElementById('dormSearch');
const searchResult = document.getElementById('searchResult');

function searchDorm() {
  const keyword = dormInput.value.trim();
  // 清除旧高亮
  document.querySelectorAll('.row.highlight').forEach(r => r.classList.remove('highlight'));

  if (!keyword) {
    searchResult.textContent = '';
    return;
  }

  const rows = document.querySelectorAll('.row');
  const matches = [];

  rows.forEach(row => {
    const dormCell = row.querySelector('td:nth-child(3)');
    if (dormCell && dormCell.textContent.includes(keyword)) {
      row.classList.add('highlight');
      matches.push(row);
    }
  });

  if (matches.length === 0) {
    searchResult.textContent = '未找到';
    searchResult.style.color = '#e11d48';
  } else {
    searchResult.textContent = `找到 ${matches.length} 个`;
    searchResult.style.color = '#16a34a';
    // 滚动到第一个匹配项
    matches[0].scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
}

function clearSearch() {
  dormInput.value = '';
  document.querySelectorAll('.row.highlight').forEach(r => r.classList.remove('highlight'));
  searchResult.textContent = '';
}

document.getElementById('searchBtn').addEventListener('click', searchDorm);
document.getElementById('clearSearchBtn').addEventListener('click', clearSearch);
dormInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    e.preventDefault();
    searchDorm();
  }
});

updateStats();
</script>
</body>
</html>
