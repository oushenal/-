<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>住宿生大巴点名表</title>
<style>
  :root{
    --blue:#2563eb;
    --blue-dark:#1d4ed8;
    --ink:#1f2937;
    --muted:#64748b;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    color:var(--ink);
    background:
      radial-gradient(1100px 520px at 50% -12%, #dbeafe 0%, rgba(219,234,254,0) 62%),
      #eef1f6;
    -webkit-font-smoothing:antialiased;
  }

  .wrap{
    width:100%;
    max-width:960px;
    margin:0 auto;
    padding:38px 18px 46px;
    flex:1;
  }

  /* ---------- 页头 ---------- */
  .page-head{text-align:center;margin-bottom:30px;}
  .page-head h1{
    margin:0;
    font-size:clamp(22px,5.2vw,30px);
    letter-spacing:1.5px;
    color:#0f2a66;
  }
  .page-head .sub{
    margin:11px 0 0;
    font-size:13.5px;
    color:var(--muted);
    letter-spacing:.3px;
  }
  .date-chip{
    display:inline-block;
    margin-top:15px;
    padding:5px 15px;
    border-radius:999px;
    background:#fff;
    border:1px solid #e2e8f0;
    font-size:12.5px;
    color:#475569;
    box-shadow:0 1px 4px rgba(15,23,42,.05);
  }

  /* ---------- 卡片网格 ---------- */
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(265px,1fr));
    gap:16px;
  }

  .card{
    position:relative;
    display:block;
    text-decoration:none;
    color:inherit;
    background:#fff;
    border-radius:18px;
    padding:20px 20px 18px;
    border:1px solid #e8edf5;
    box-shadow:0 3px 14px rgba(15,23,42,.07);
    overflow:hidden;
    transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    animation:cardIn .45s ease both;
  }
  .card:nth-child(1){animation-delay:.04s;}
  .card:nth-child(2){animation-delay:.12s;}
  .card:nth-child(3){animation-delay:.20s;}

  @keyframes cardIn{
    from{opacity:0;transform:translateY(12px);}
    to{opacity:1;transform:translateY(0);}
  }

  .card::after{
    content:"";
    position:absolute;
    left:0;right:0;bottom:0;
    height:4px;
    background:linear-gradient(90deg,#3b82f6,#1d4ed8);
    transform:scaleX(0);
    transform-origin:left;
    transition:transform .28s ease;
  }
  .card:hover{
    transform:translateY(-3px);
    box-shadow:0 12px 28px rgba(37,99,235,.17);
    border-color:#c7d9f7;
  }
  .card:hover::after{transform:scaleX(1);}
  .card:active{transform:translateY(-1px) scale(.995);}
  .card:focus-visible{
    outline:3px solid rgba(37,99,235,.35);
    outline-offset:2px;
  }

  .card-top{display:flex;align-items:center;gap:13px;}
  .bus-badge{
    width:52px;height:52px;flex:none;
    border-radius:15px;
    background:linear-gradient(135deg,#3b82f6,#1d4ed8);
    color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-size:26px;font-weight:800;
    box-shadow:0 6px 14px rgba(37,99,235,.30);
  }
  .card-title h2{margin:0;font-size:18px;color:#0f2a66;letter-spacing:.5px;}
  .card-title p{margin:4px 0 0;font-size:12.5px;color:var(--muted);}
  .arrow{
    margin-left:auto;
    font-size:20px;
    color:#cbd5e1;
    transition:transform .2s ease,color .2s ease;
  }
  .card:hover .arrow{transform:translateX(4px);color:#3b82f6;}

  .card-meta{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:16px;
  }
  .pill{
    font-size:12px;
    padding:4px 11px;
    border-radius:999px;
    background:#f1f5f9;
    color:#475569;
    white-space:nowrap;
  }
  .pill b{color:#2563eb;font-weight:700;}

  .card-note{
    display:flex;
    align-items:flex-start;
    gap:6px;
    margin-top:12px;
    padding:8px 11px;
    border-radius:10px;
    background:#fff8e1;
    border:1px solid #ffe08a;
    color:#8a5a00;
    font-size:12.5px;
    line-height:1.45;
  }
  .card-note strong{color:#c2410c;font-weight:700;}

  /* ---------- 页脚 ---------- */
  .page-foot{
    text-align:center;
    font-size:12px;
    line-height:1.9;
    color:#94a3b8;
    margin-top:34px;
  }
  .page-foot .dot{margin:0 6px;color:#cbd5e1;}

  @media (max-width:480px){
    .wrap{padding:26px 14px 36px;}
    .card{padding:17px 16px 15px;border-radius:16px;}
    .bus-badge{width:46px;height:46px;font-size:23px;border-radius:13px;}
    .card-title h2{font-size:16.5px;}
    .card-title p{font-size:12px;}
  }

  @media (prefers-reduced-motion:reduce){
    *{animation:none !important;transition:none !important;}
  }
</style>
</head>
<body>

<div class="wrap">

  <header class="page-head">
    <h1>住宿生大巴点名表</h1>
    <p class="sub">共 3 辆车 ｜ 49 名住宿生</p>
    <div class="date-chip" id="today"></div>
  </header>

  <main class="grid">

    <!-- 1号巴士 -->
    <a class="card" href="bus1.html">
      <div class="card-top">
        <div class="bus-badge">1</div>
        <div class="card-title">
          <h2>1号巴士</h2>
          <p>1班 · 4班 · 8班 · 10班</p>
        </div>
        <span class="arrow">→</span>
      </div>
      <div class="card-meta">
        <span class="pill">共 <b>15</b> 人</span>
        <span class="pill">4 个班级</span>
      </div>
      <div class="card-note">
        <span>🔔</span>
        <span><strong>10班全体 3 个寝室</strong> 需前往 4号车</span>
      </div>
    </a>

    <!-- 2号巴士 -->
    <a class="card" href="bus2.html">
      <div class="card-top">
        <div class="bus-badge">2</div>
        <div class="card-title">
          <h2>2号巴士</h2>
          <p>2班 · 3班 · 7班</p>
        </div>
        <span class="arrow">→</span>
      </div>
      <div class="card-meta">
        <span class="pill">共 <b>19</b> 人</span>
        <span class="pill">3 个班级</span>
      </div>
      <div class="card-note">
        <span>🔔</span>
        <span><strong>2班女生 3 个寝室</strong> 需前往 4号车</span>
      </div>
    </a>

    <!-- 3号巴士 -->
    <a class="card" href="bus3.html">
      <div class="card-top">
        <div class="bus-badge">3</div>
        <div class="card-title">
          <h2>3号巴士</h2>
          <p>5班 · 6班 · 9班</p>
        </div>
        <span class="arrow">→</span>
      </div>
      <div class="card-meta">
        <span class="pill">共 <b>15</b> 人</span>
        <span class="pill">3 个班级</span>
      </div>
      <div class="card-note">
        <span>🔔</span>
        <span><strong>6班女生 3 个寝室</strong> 需前往 4号车</span>
      </div>
    </a>

  </main>

  <footer class="page-foot">
    点击卡片进入对应车辆点名表<span class="dot">·</span>支持宿舍号查找定位
    <br>
    蓝色底行表示该生需前往其他车辆
  </footer>

</div>

<script>
  (function () {
    var d = new Date();
    var week = '日一二三四五六'[d.getDay()];
    document.getElementById('today').textContent =
      d.getFullYear() + '年' + (d.getMonth() + 1) + '月' + d.getDate() + '日 星期' + week;
  })();
</script>

</body>
</html>
