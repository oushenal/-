<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>2号巴士 点名表</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:#eef1f6;color:#1f2937;-webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:880px;margin:0 auto;padding:14px 12px 104px;}

  /* ---------- 头部 ---------- */
  .hero{
    display:flex;align-items:center;gap:13px;
    background:linear-gradient(135deg,#2f6bff,#1d4ed8);
    color:#fff;border-radius:16px;padding:16px 18px;
    box-shadow:0 8px 20px rgba(37,99,235,.28);margin-bottom:14px;
  }
  .bus-badge{
    width:50px;height:50px;flex:none;border-radius:14px;
    background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.65);
    display:flex;align-items:center;justify-content:center;
    font-size:27px;font-weight:800;
  }
  .hero h1{margin:0;font-size:20px;letter-spacing:.5px;}
  .hero p{margin:4px 0 0;font-size:12.5px;opacity:.88;}

  /* ---------- 搜索栏 ---------- */
  .search-bar{
    display:flex;align-items:center;gap:8px;
    background:#fff;border-radius:12px;padding:8px 12px;
    margin-bottom:14px;box-shadow:0 2px 8px rgba(15,23,42,.05);
    flex-wrap:wrap;
  }
  .search-bar input{
    flex:1;min-width:120px;border:none;outline:none;
    font-size:14px;padding:8px 4px;font-family:inherit;
    background:transparent;color:#1e293b;
  }
  .search-bar input::placeholder{color:#94a3b8;}
  .search-bar button{
    border:none;border-radius:8px;padding:8px 14px;
    font-size:13.5px;font-weight:600;cursor:pointer;
    font-family:inherit;transition:transform .12s,background .15s;
    white-space:nowrap;
  }
  .search-bar button:active{transform:scale(.95);}
  #searchBtn{background:#2563eb;color:#fff;}
  #searchBtn:active{background:#1d4ed8;}
  #clearSearchBtn{background:#eef2f7;color:#475569;}
  #clearSearchBtn:active{background:#e2e8f0;}
  .search-result{
    font-size:12.5px;color:#64748b;margin-left:4px;
    white-space:nowrap;min-width:48px;
  }

  /* ---------- 分组卡片 ---------- */
  .group{
    background:#fff;border-radius:14px;overflow:hidden;
    margin-bottom:14px;box-shadow:0 2px 10px rgba(15,23,42,.06);
  }
  .group-head{
    display:flex;align-items:center;gap:10px;
    padding:11px 14px;background:#f8fafc;border-bottom:1px solid #e6eaf0;
  }
  .group-name{font-weight:700;font-size:16px;color:#1e3a8a;}
  .group-count{font-size:13px;color:#64748b;margin-right:auto;}
  .all-btn{
    border:1px solid #cbd5e1;background:#fff;color:#334155;
    border-radius:8px;padding:5px 11px;font-size:12.5px;cursor:pointer;
    font-family:inherit;transition:transform .12s,background .15s;
  }
  .all-btn:active{transform:scale(.95);background:#f1f5f9;}

  /* ---------- 表格 ---------- */
  .tbl{width:100%;border-collapse:collapse;}
  .tbl th{
    font-size:11.5px;font-weight:600;color:#94a3b8;text-align:left;
    padding:8px 4px;border-bottom:1px solid #eef2f7;background:#fff;
    white-space:nowrap;
  }
  .tbl td{
    padding:9px 4px;border-bottom:1px solid #f1f5f9;
    font-size:13px;vertical-align:middle;line-height:1.35;
  }
  .tbl tr:last-child td{border-bottom:none;}
  .tbl th:nth-child(1){width:7%;}    /* 序号 */
  .tbl th:nth-child(2){width:16%;}   /* 姓名 */
  .tbl th:nth-child(3){width:8%;}    /* 性别 */
  .tbl th:nth-child(4){width:16%;}   /* 宿舍 */
  .tbl th:nth-child(5){width:17%;}   /* 职务 */
  .tbl th:nth-child(6){width:8%;}    /* 人数 */
  .tbl th:nth-child(7){width:12%;text-align:center;}  /* 状态 */
  .tbl th:nth-child(8){width:16%;text-align:center;}  /* 实到 */
  .tbl td:nth-child(1){text-align:center;color:#94a3b8;font-size:12px;}
  .tbl td:nth-child(6){text-align:center;color:#64748b;}
  .tbl td:nth-child(7),
  .tbl td:nth-child(8){text-align:center;}
  .tbl td:nth-child(4),
  .tbl td:nth-child(5){color:#475569;font-size:12.5px;}

  .name{font-weight:600;color:#1e293b;}

  /* ---------- 行状态 ---------- */
  .row{cursor:pointer;transition:background .15s;}
  .row:active{background:#f8fafc;}
  .row.done{background:#f0fdf4;}
  .row.done .name{color:#15803d;}

  /* 2班女生去4号车：蓝色底 + 左侧蓝条 */
  .row.divert{background:#e8f1ff;}
  .row.divert td:first-child{box-shadow:inset 4px 0 0 #3b82f6;}
  .row.divert .name{color:#1d4ed8;}
  .row.divert:active{background:#dbe8ff;}
  .row.divert.done{background:#e8f8ef;}
  .row.divert.done .name{color:#15803d;}

  /* 搜索高亮 */
  .row.highlight{
    background:#fef3c7 !important;
    box-shadow:inset 0 0 0 2px #f59e0b;
  }
  @keyframes flash{
    0%{box-shadow:inset 0 0 0 2px #f59e0b;}
    50%{box-shadow:inset 0 0 0 4px #fbbf24;}
    100%{box-shadow:inset 0 0 0 2px #f59e0b;}
  }
  .row.highlight{animation:flash .9s ease 1;}

  .box{
    display:inline-block;width:22px;height:22px;border-radius:7px;
    border:2px solid #cbd5e1;background:#fff;position:relative;
    transition:background .15s,border-color .15s;
  }
  .row.done .box{background:#16a34a;border-color:#16a34a;}
  .row.done .box::after{
    content:"";position:absolute;left:6px;top:2px;width:6px;height:11px;
    border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg);
  }

  .gender{
    display:inline-block;min-width:24px;text-align:center;
    padding:2px 5px;border-radius:6px;font-size:11px;font-weight:600;
  }
  .g-f{background:#fce7f3;color:#be185d;}
  .g-m{background:#dbeafe;color:#1d4ed8;}

  /* ---------- 实到人数输入框 ---------- */
  .actual-input{
    width:52px;height:30px;text-align:center;
    border:1px solid #cbd5e1;border-radius:9px;
    font-size:13px;font-weight:600;font-family:inherit;
    color:#1e3a8a;background:#f8fafc;outline:none;
    transition:border-color .15s,box-shadow .15s,background .15s;
  }
  .actual-input::placeholder{color:#cbd5e1;font-weight:400;}
  .actual-input:focus{
    border-color:#2563eb;background:#fff;
    box-shadow:0 0 0 3px rgba(37,99,235,.15);
  }
  .actual-input::-webkit-outer-spin-button,
  .actual-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  .actual-input[type=number]{-moz-appearance:textfield;appearance:textfield;}

  /* ---------- 底部统计栏 ---------- */
  .footer-bar{
    position:fixed;left:0;right:0;bottom:0;z-index:9;
    max-width:880px;margin:0 auto;
    display:flex;align-items:center;gap:12px;
    padding:12px 16px calc(12px + env(safe-area-inset-bottom));
    background:rgba(255,255,255,.94);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    border-top:1px solid #e2e8f0;border-radius:16px 16px 0 0;
    box-shadow:0 -4px 16px rgba(15,23,42,.06);
  }
  .stat{font-size:13.5px;color:#475569;}
  .stat b{color:#2563eb;font-size:19px;font-weight:800;margin:0 1px;}
  #resetBtn{
    margin-left:auto;border:none;border-radius:10px;
    padding:9px 20px;background:#eef2f7;color:#475569;
    font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;
    transition:transform .12s,background .15s;
  }
  #resetBtn:active{transform:scale(.96);background:#e2e8f0;}

  @media (max-width:560px){
    .tbl th,.tbl td{padding:7px 3px;font-size:11.5px;}
    .tbl th:nth-child(5),.tbl td:nth-child(5){font-size:11px;}
    .actual-input{width:44px;height:28px;font-size:12px;}
    .gender{min-width:20px;padding:1px 4px;font-size:10px;}
  }

  @media print{
    body{background:#fff;}
    .wrap{padding-bottom:0;max-width:none;}
    .footer-bar,.all-btn,.search-bar{display:none;}
    .group{box-shadow:none;border:1px solid #ddd;}
    .hero{box-shadow:none;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    .row.divert{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    .row.highlight{background:transparent !important;box-shadow:none !important;animation:none !important;}
    .actual-input{border:1px solid #999;background:#fff;}
  }
</style>
</head>
<body>

<div class="wrap">
  <header class="hero">
    <div class="bus-badge">2</div>
    <div>
      <h1>2号巴士 点名表</h1>
      <p>2班 · 3班 · 7班 住宿生 ｜ 共 19 人</p>
    </div>
  </header>

  <!-- 宿舍号查找定位 -->
  <div class="search-bar">
    <input type="search" id="dormSearch" placeholder="输入宿舍号，如 205 或 女生205" autocomplete="off">
    <button id="searchBtn">查找</button>
    <button id="clearSearchBtn">清除</button>
    <span class="search-result" id="searchResult"></span>
  </div>

  <div id="list"></div>
</div>

<div class="footer-bar">
  <div class="stat">已到 <b id="doneCount">0</b> / <span id="totalCount">19</span> 人</div>
  <button id="resetBtn">重 置</button>
</div>

<script>
const DATA = [
  {
    cls: '2班',
    students: [
      { no:'1',  name:'曾翔',   gender:'女', dorm:'女生205', duty:'宿舍长', num:'5', otherBus:true },
      { no:'6',  name:'禤雨诗', gender:'女', dorm:'女生206', duty:'宿舍长', num:'4', otherBus:true },
      { no:'10', name:'杨芷涵', gender:'女', dorm:'女生207', duty:'宿舍长', num:'5', otherBus:true },
      { no:'15', name:'张晁',   gender:'男', dorm:'男生203', duty:'宿舍长', num:'6' },
      { no:'21', name:'李辰希', gender:'男', dorm:'男生204', duty:'宿舍长', num:'5' },
      { no:'25', name:'唐楚峰', gender:'男', dorm:'男生311', duty:'并入204', num:'' }
    ]
  },
  {
    cls: '3班',
    students: [
      { no:'1',  name:'庄悦欣', gender:'女', dorm:'女生208', duty:'宿舍长', num:'4' },
      { no:'5',  name:'吴施霖', gender:'女', dorm:'女生209', duty:'宿舍长', num:'5' },
      { no:'10', name:'杨丹妍', gender:'女', dorm:'女生210', duty:'宿舍长', num:'3' },
      { no:'',   name:'王珞嘉', gender:'男', dorm:'男生205', duty:'宿舍长', num:'9' },
      { no:'13', name:'王文江', gender:'男', dorm:'男生204', duty:'并入205', num:'' },
      { no:'14', name:'林钊灏', gender:'男', dorm:'男生204', duty:'并入205', num:'' },
      { no:'21', name:'支剑瀚', gender:'男', dorm:'男生313', duty:'并入205', num:'' }
    ]
  },
  {
    cls: '7班',
    students: [
      { no:'1',  name:'陈绰淼', gender:'女', dorm:'女生218', duty:'宿舍长', num:'6' },
      { no:'7',  name:'林心蕾', gender:'女', dorm:'女生219', duty:'宿舍长', num:'6' },
      { no:'13', name:'黄泓睿', gender:'男', dorm:'男生305', duty:'宿舍长', num:'8或9' },
      { no:'19', name:'余正元', gender:'男', dorm:'男生306', duty:'并入305', num:'' },
      { no:'20', name:'李宗卫', gender:'男', dorm:'男生306', duty:'并入305', num:'' },
      { no:'21', name:'陈治达', gender:'男', dorm:'男生313', duty:'并入305', num:'' }
    ]
  }
];

const listEl = document.getElementById('list');

DATA.forEach((group, gi) => {
  const section = document.createElement('section');
  section.className = 'group';
  section.innerHTML = `
    <div class="group-head">
      <span class="group-name">${group.cls}</span>
      <span class="group-count"><b>0</b>/${group.students.length}</span>
      <button class="all-btn" data-group="${gi}">全部到齐</button>
    </div>
    <table class="tbl">
      <thead>
        <tr>
          <th>序号</th><th>姓名</th><th>性别</th><th>宿舍</th><th>职务</th><th>人数</th><th>状态</th><th>实到</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>`;

  const tbody = section.querySelector('tbody');

  group.students.forEach((s, si) => {
    const tr = document.createElement('tr');
    tr.className = 'row' + (s.otherBus ? ' divert' : '');
    tr.dataset.group = gi;
    tr.dataset.key = gi + '-' + si;
    tr.innerHTML = `
      <td>${s.no || ''}</td>
      <td class="name">${s.name}</td>
      <td><span class="gender ${s.gender === '女' ? 'g-f' : 'g-m'}">${s.gender}</span></td>
      <td>${s.dorm}</td>
      <td>${s.duty}</td>
      <td>${s.num || ''}</td>
      <td><span class="box"></span></td>
      <td><input class="actual-input" type="number" min="0" inputmode="numeric" placeholder="—" aria-label="${s.name} 实到人数"></td>`;

    tr.addEventListener('click', () => {
      tr.classList.toggle('done');
      updateStats();
    });

    const input = tr.querySelector('.actual-input');
    input.addEventListener('click', e => e.stopPropagation());
    input.addEventListener('keydown', e => e.stopPropagation());
    input.addEventListener('input', () => {
      input.value = input.value.replace(/[^\d]/g, '');
    });

    tbody.appendChild(tr);
  });

  listEl.appendChild(section);
});

/* 统计 */
function updateStats() {
  const rows = document.querySelectorAll('.row');
  const done = document.querySelectorAll('.row.done').length;
  document.getElementById('doneCount').textContent = done;
  document.getElementById('totalCount').textContent = rows.length;

  document.querySelectorAll('.group').forEach(g => {
    const all = g.querySelectorAll('.row').length;
    const d = g.querySelectorAll('.row.done').length;
    g.querySelector('.group-count b').textContent = d;
  });
}

/* 整班「全部到齐」 */
document.querySelectorAll('.all-btn').forEach(btn => {
  btn.addEventListener('click', e => {
    e.stopPropagation();
    const rows = document.querySelectorAll(`.row[data-group="${btn.dataset.group}"]`);
    const allDone = Array.from(rows).every(r => r.classList.contains('done'));
    rows.forEach(r => r.classList.toggle('done', !allDone));
    updateStats();
  });
});

/* 重置：清空点名状态 + 实到人数 */
document.getElementById('resetBtn').addEventListener('click', () => {
  document.querySelectorAll('.row.done').forEach(r => r.classList.remove('done'));
  document.querySelectorAll('.actual-input').forEach(i => i.value = '');
  updateStats();
});

/* ---------- 宿舍号查找定位 ---------- */
const dormInput = document.getElementById('dormSearch');
const searchResult = document.getElementById('searchResult');

function searchDorm() {
  const keyword = dormInput.value.trim();
  document.querySelectorAll('.row.highlight').forEach(r => r.classList.remove('highlight'));

  if (!keyword) {
    searchResult.textContent = '';
    return;
  }

  const rows = document.querySelectorAll('.row');
  const matches = [];

  rows.forEach(row => {
    const dormCell = row.querySelector('td:nth-child(4)');
    if (dormCell && dormCell.textContent.includes(keyword)) {
      row.classList.add('highlight');
      matches.push(row);
    }
  });

  if (matches.length === 0) {
    searchResult.textContent = '未找到';
    searchResult.style.color = '#e11d48';
  } else {
    searchResult.textContent = `找到 ${matches.length} 个`;
    searchResult.style.color = '#16a34a';
    matches[0].scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
}

function clearSearch() {
  dormInput.value = '';
  document.querySelectorAll('.row.highlight').forEach(r => r.classList.remove('highlight'));
  searchResult.textContent = '';
}

document.getElementById('searchBtn').addEventListener('click', searchDorm);
document.getElementById('clearSearchBtn').addEventListener('click', clearSearch);
dormInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    e.preventDefault();
    searchDorm();
  }
});

updateStats();
</script>
</body>
</html>
